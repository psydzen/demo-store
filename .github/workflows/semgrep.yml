name: Semgrep

# The repository's only gate today is a stage inside the Dockerfile, which runs
# on the whole tree and cannot tell a new finding from an old one. This job is
# separate, runs on pull requests, and reports only what the pull request adds.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Interprocedural rules
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --baseline-commit needs the history the pull request branched from.
          fetch-depth: 0

      # Interfile taint is a Pro feature. With a token the six rules reach across
      # packages; without one they stay single-file and lose three of their
      # cross-package findings. `--pro` without a token does not degrade — it
      # errors out and reports nothing — so the flag is set only when the secret
      # is there.
      - name: Pick the engine
        id: engine
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            echo "flag=--pro" >> "$GITHUB_OUTPUT"
            echo "Interfile engine: token present."
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::warning::SEMGREP_APP_TOKEN is not set; running the single-file engine. Cross-package findings will be missed."
          fi

      - name: Scan the pull request
        if: github.event_name == 'pull_request'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep ${{ steps.engine.outputs.flag }} \
            --config rules/semgrep \
            --exclude internal/analysisfixtures \
            --baseline-commit "$(git merge-base origin/${{ github.base_ref }} HEAD)" \
            --sarif --output semgrep.sarif

      - name: Scan the whole tree
        if: github.event_name == 'push'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep ${{ steps.engine.outputs.flag }} \
            --config rules/semgrep \
            --exclude internal/analysisfixtures \
            --sarif --output semgrep.sarif

      - name: Upload the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-interproc

      # Three rules block and three advise, so the exit code follows the
      # severity rather than the mere existence of a finding. Everything is in
      # the security tab either way.
      - name: Stop only on the blocking rules
        if: always() && hashFiles('semgrep.sarif') != ''
        run: python3 scripts/gate_sarif.py semgrep.sarif

  fixtures:
    name: Rules are not empty
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the engine
        id: engine
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            echo "flag=--pro" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Every rule owns a `// ruleid:` case and an `// ok:` case. The gate asks
      # only that each rule still matches at least one of its own: the strict
      # 25-of-25 score is met by the Pro engine alone, and a red job on every
      # pull request would teach everyone to ignore it.
      - name: Check the fixture corpus
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          PYTHONPATH=scripts python3 scripts/check_semgrep.py \
            ${{ steps.engine.outputs.flag }} --require-nonempty
