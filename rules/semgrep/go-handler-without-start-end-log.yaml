rules:
  - id: go-handler-without-start-end-log
    languages: [go]
    severity: WARNING
    message: >-
      This request handler does not log both the start and the end of the call.
      Known limit: Semgrep only sees the body of the handler, so a handler whose
      start/end logs come from a server-wide interceptor is reported here as
      well.
    metadata:
      category: best-practice
      rule-family: interprocedural-comparison
      confidence: LOW
    pattern-either:
      - patterns:
          - pattern: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) (*$Q, error) {
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) (*$Q, error) {
                ...
                $L.Info("call started", ...)
                ...
                $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) (*$Q, error) {
                ...
                $L.Info("call started", ...)
                ...
                defer $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) (*$Q, error) {
                ...
                defer $L2.Info("call finished", ...)
                ...
                $L.Info("call started", ...)
                ...
              }
      - patterns:
          - pattern: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) ($RESP *$Q, $ERR error) {
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) ($RESP *$Q, $ERR error) {
                ...
                $L.Info("call started", ...)
                ...
                $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) ($RESP *$Q, $ERR error) {
                ...
                $L.Info("call started", ...)
                ...
                defer $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($CTX context.Context, $REQ *$P) ($RESP *$Q, $ERR error) {
                ...
                defer $L2.Info("call finished", ...)
                ...
                $L.Info("call started", ...)
                ...
              }
      - patterns:
          - pattern: |
              func $F($W http.ResponseWriter, $R *http.Request) {
                ...
              }
          - pattern-not: |
              func $F($W http.ResponseWriter, $R *http.Request) {
                ...
                $L.Info("call started", ...)
                ...
                $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func $F($W http.ResponseWriter, $R *http.Request) {
                ...
                $L.Info("call started", ...)
                ...
                defer $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func $F($W http.ResponseWriter, $R *http.Request) {
                ...
                defer $L2.Info("call finished", ...)
                ...
                $L.Info("call started", ...)
                ...
              }
      - patterns:
          - pattern: |
              func ($RECV $T) $F($W http.ResponseWriter, $R *http.Request) {
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($W http.ResponseWriter, $R *http.Request) {
                ...
                $L.Info("call started", ...)
                ...
                $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($W http.ResponseWriter, $R *http.Request) {
                ...
                $L.Info("call started", ...)
                ...
                defer $L2.Info("call finished", ...)
                ...
              }
          - pattern-not: |
              func ($RECV $T) $F($W http.ResponseWriter, $R *http.Request) {
                ...
                defer $L2.Info("call finished", ...)
                ...
                $L.Info("call started", ...)
                ...
              }
