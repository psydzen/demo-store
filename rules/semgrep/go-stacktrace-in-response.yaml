rules:
  - id: go-stacktrace-in-response
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      The text of an error reaches the client. Errors carry file paths, SQL
      fragments and wrapped internals; log them and return a fixed message.
    metadata:
      category: security
      rule-family: interprocedural-comparison
    options:
      interfile: true
    pattern-sources:
      - pattern: "(err : error)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: http.Error($W, $MSG, $CODE)
                  - focus-metavariable: $MSG
              - patterns:
                  - pattern: fmt.Fprintf($W, $FMT, ...)
                  - focus-metavariable: $FMT
              - patterns:
                  - pattern: status.Error($CODE, $MSG)
                  - focus-metavariable: $MSG
              - patterns:
                  - pattern: status.Errorf($CODE, $FMT, ...)
                  - focus-metavariable: $FMT
