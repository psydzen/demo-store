services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://quiz:quiz@db:5432/quiz?sslmode=disable"
      # Change this before showing the app to anyone.
      ADMIN_TOKEN: "change-me-admin-token-01"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
